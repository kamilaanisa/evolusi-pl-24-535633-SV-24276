name: CI/CD

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Configure database env
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulasi deploy ke staging
        run: |
          echo "Menyiapkan environment staging..."
          echo "Build dan test lolos, siap diverifikasi sebelum production."

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ke production (simulasi)
        run: |
          echo "1. Kunci pintu — tampilkan halaman pemeliharaan (php artisan down --retry=60)"
          echo "2. Ambil kode terbaru (git pull origin main)"
          echo "3. Pasang dependensi tanpa paket dev (composer install --no-dev --optimize-autoloader)"
          echo "4. Ubah skema basis data (php artisan migrate --force)"
          echo "5. Bangun ulang cache konfigurasi, route, dan view (php artisan config:cache, route:cache, view:cache)"
          echo "6. Muat ulang pekerja antrean (php artisan queue:restart)"
          echo "7. Buka pintu kembali (php artisan up)"